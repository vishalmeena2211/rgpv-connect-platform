<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600&display=swap">
<style>
html,body{margin:0}
body{width:1856px;height:1000px;overflow:hidden;font-family:'DM Sans',sans-serif;background:
 radial-gradient(900px 500px at 15% 0%,rgba(15,138,111,.16),transparent 70%),radial-gradient(800px 460px at 95% 100%,rgba(183,121,31,.12),transparent 70%),#F6F6F3;position:relative}
