<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#312e81"/></linearGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#bg)"/>
  <!-- faint grid of enrollment numbers -->
  <g fill="#ffffff" opacity="0.04" font-size="22">
    <text x="60" y="70">0151CS21001</text><text x="520" y="40">0247IT22014</text><text x="1500" y="60">0701ME20007</text><text x="1740" y="320">0751BT16012</text><text x="1600" y="560">0151EC23011</text><text x="300" y="580">0247CS24002</text><text x="1000" y="585">0701CE21009</text>
  </g>
  <!-- title -->
  <text x="120" y="190" font-size="92" font-weight="700" fill="#eef2ff" letter-spacing="-2">RGPV Connect</text>
  <text x="124" y="252" font-size="34" fill="#eef2ff" opacity="0.85">Results, notes and a campus network. Every profile is tied to a real enrollment number.</text>

  <!-- left: the enrollment number, decoded -->
  <g transform="translate(120,320)">
    <text x="0" y="-14" font-size="22" fill="#eef2ff" opacity="0.7">What verification does with an enrollment number</text>
    <g font-size="72" font-weight="700" letter-spacing="2">
      <text x="0" y="70" fill="#a5b4fc">0751</text>
      <text x="212" y="70" fill="#c4b5fd">BT</text>
      <text x="334" y="70" fill="#fbbf24">16</text>
      <text x="446" y="70" fill="#eef2ff" opacity="0.6">012</text>
    </g>
    <g font-size="24" fill="#eef2ff">
      <text x="0" y="130" fill="#a5b4fc" font-weight="700">0751</text><text x="110" y="130" opacity="0.6">college</text><text x="240" y="130">Sagar Institute of Science &amp; Technology, Bhopal</text>
      <text x="0" y="166" fill="#c4b5fd" font-weight="700">BT</text><text x="110" y="166" opacity="0.6">branch</text><text x="240" y="166">Biotechnology</text>
      <text x="0" y="202" fill="#fbbf24" font-weight="700">16</text><text x="110" y="202" opacity="0.6">admitted</text><text x="240" y="202">2016, so the graduating batch is 2020</text>
      <text x="0" y="238" opacity="0.6" font-weight="700">012</text><text x="110" y="238" opacity="0.6">serial</text><text x="240" y="238">the student's roll within that college and branch</text>
    </g>
  </g>

  <!-- right: the verified card -->
  <g transform="translate(1120,292)">
    <rect width="680" height="260" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
    <rect x="30" y="28" width="132" height="36" rx="18" fill="#22c55e"/>
    <text x="96" y="53" font-size="20" font-weight="700" fill="#052e16" text-anchor="middle">VERIFIED</text>
    <text x="180" y="54" font-size="22" fill="#eef2ff" opacity="0.85">proved by fetching the student's result</text>
    <text x="30" y="106" font-size="20" fill="#eef2ff" opacity="0.6">from result.rgpv.ac.in, captcha solved on the way</text>
    <g font-size="20" font-weight="700" fill="#1e1b4b">
      <rect x="30" y="134" width="150" height="40" rx="20" fill="#a5b4fc"/><text x="105" y="161" text-anchor="middle">College 0751</text>
      <rect x="196" y="134" width="170" height="40" rx="20" fill="#c4b5fd"/><text x="281" y="161" text-anchor="middle">Biotechnology</text>
      <rect x="382" y="134" width="140" height="40" rx="20" fill="#fbbf24"/><text x="452" y="161" text-anchor="middle">Batch 2020</text>
    </g>
    <text x="30" y="222" font-size="22" fill="#eef2ff">College, branch and batch decoded, never typed.</text>
  </g>
</svg>
